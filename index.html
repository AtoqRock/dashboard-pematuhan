<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pelaporan Pematuhan</title>
  <!-- Pautan Font Awesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      background-color: #f8fafc;
      overflow: hidden;
    }

    /* Sidebar Menu Kiri - Tema Biru Gelap */
    .sidebar {
      width: 260px;
      padding: 0;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background-color: #0b4db7; /* Warna biru utama */
      height: 100vh;
      flex-shrink: 0;
      overflow-y: auto;
    }

    /* Ruang Kosong Atas (Sama seperti dalam gambar) */
    .sidebar-header-space {
      height: 80px;
      background-color: #093f96; /* Ton warna biru lebih gelap di bahagian paling atas */
    }

    /* Kemaskan reka bentuk Scrollbar pada Sidebar */
    .sidebar::-webkit-scrollbar {
      width: 5px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    /* Senarai Navigasi */
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0;
      margin: 0;
    }

    /* Butang Menu Navigasi */
    .menu-btn {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background-color: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      gap: 15px;
    }

    .menu-btn:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    /* Keadaan Aktif (Menu dipelihara) */
    .menu-btn.active {
      background-color: #3b71ca; /* Warna highlight aktif */
      font-weight: 600;
    }

    .menu-btn i {
      font-size: 18px;
      width: 22px;
      text-align: center;
      color: #ffffff;
    }

    .menu-text {
      line-height: 1.3;
    }

    /* Ruang Paparan Kanan */
    .content-area {
      flex: 1;
      height: 100vh;
      box-sizing: border-box;
      background-color: #f1f5f9;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

<div class="sidebar">
  
  <!-- Ruang Paling Atas -->
  <div class="sidebar-header-space"></div>

  <div class="nav-list">
    <!-- Menu Laman Utama -->
    <a class="menu-btn active" href="https://datastudio.google.com/embed/reporting/85805ae9-776c-4bb3-b2e2-d73507393f10/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
      <i class="fa-solid fa-house"></i>
      <span class="menu-text">Laman Utama</span>
    </a>

    <!-- Menu Standard Verifikasi SPLa -->
    <a class="menu-btn" href="https://datastudio.google.com/embed/reporting/85805ae9-776c-4bb3-b2e2-d73507393f10/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
      <i class="fa-regular fa-file-lines"></i>
      <span class="menu-text">Standard Verifikasi SPLa</span>
    </a>

    <!-- Menu Pelaksanaan SPLa -->
    <a class="menu-btn" href="https://lookerstudio.google.com/embed/reporting/81654b52-a3eb-4542-914c-828ea06b8d4b/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
      <i class="fa-solid fa-list-check"></i>
      <span class="menu-text">Pelaksanaan SPLa</span>
    </a>

    <!-- Menu Penceramah & Slot -->
    <a class="menu-btn" href="https://datastudio.google.com/embed/reporting/8c040687-9881-439c-8290-4e2f12b486ca/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
      <i class="fa-solid fa-user"></i>
      <span class="menu-text">Penceramah &amp; Slot</span>
    </a>

    <!-- Menu Keberkesanan Program -->
    <a class="menu-btn" href="https://datastudio.google.com/embed/reporting/ff08c01e-df02-4565-95d6-f8e8c89d9861/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
      <i class="fa-solid fa-chart-line"></i>
      <span class="menu-text">Keberkesanan Program</span>
    </a>

    <!-- Menu Pemantauan & Tindakan Susulan -->
    <a class="menu-btn" href="https://datastudio.google.com/embed/reporting/8791b019-9a18-4451-910f-8b8afe893301/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
      <i class="fa-solid fa-check-double"></i>
      <span class="menu-text">Pemantauan &amp;<br>Tindakan Susulan</span>
    </a>
  </div>

</div>

<div class="content-area">
  <iframe id="iframe_konten" name="iframe_konten" src="https://lookerstudio.google.com/embed/reporting/85805ae9-776c-4bb3-b2e2-d73507393f10/page/mZD4F" allowfullscreen></iframe>
</div>

<script>
  function tukarAktif(element) {
    var buttons = document.querySelectorAll('.menu-btn');
    buttons.forEach(function(btn) {
      btn.classList.remove('active');
    });
    element.classList.add('active');
  }
</script>

</body>
</html>
