<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pelaporan Pematuhan</title>
  <!-- Pautan Font Awesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-blue: #0b4db7;
      --dark-blue: #093f96;
      --accent-blue: #1d61d1;
      --active-blue: #3b71ca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column; /* Header di atas, kandungan utama di bawah */
      background-color: #f8fafc;
      overflow: hidden;
    }

    /* ==================== 1. HEADER UTAMA ==================== */
    .top-header {
      height: 85px; /* Ketinggian header disesuaikan untuk logo besar */
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      position: relative;
      overflow: hidden;
      z-index: 10;
      flex-shrink: 0;
    }

    /* Bahagian Kiri Header: Logo & Slogan */
    .header-left {
      display: flex;
      align-items: center;
      padding-left: 20px;
      z-index: 2;
    }

    .header-logo {
      height: 65px; /* Saiz logo KPM yang dibesarkan */
      width: auto;
      margin-right: 15px;
      object-fit: contain;
    }

    .header-title-box {
      border-right: 1.5px solid #cbd5e1;
      padding-right: 20px;
      margin-right: 20px;
    }

    .header-title-box h1 {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
      line-height: 1.2;
      letter-spacing: 0.3px;
    }

    .header-title-box p {
      font-size: 13px;
      color: #1e3a8a;
      margin: 2px 0 0 0;
      font-weight: 600;
    }

    .header-slogan {
      font-size: 13px;
      color: #1e3a8a;
      line-height: 1.3;
      font-weight: 500;
    }

    /* Bahagian Kanan Header: Corak Condong & Tarikh */
    .header-right {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
      padding-right: 25px;
      background: var(--dark-blue);
      color: #ffffff;
    }

    /* Jalur condong (Kuning & Biru Cerah) */
    .header-right::before {
      content: "";
      position: absolute;
      left: -65px;
      top: 0;
      bottom: 0;
      width: 70px;
      background: var(--dark-blue);
      transform: skewX(-25deg);
      border-left: 8px solid #fbbf24; /* Jalur Kuning */
      box-shadow: -6px 0 0 #0284c7;   /* Jalur Biru Cerah */
    }

    .header-info-group {
      display: flex;
      align-items: center;
      gap: 25px;
      position: relative;
      z-index: 2;
      font-size: 12px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-item i {
      font-size: 22px;
      opacity: 0.9;
    }

    .info-text-box {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 10px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 13px;
      font-weight: 700;
    }

    .info-divider {
      width: 1px;
      height: 25px;
      background-color: rgba(255, 255, 255, 0.3);
    }

    /* ==================== 2. BEKAS UTAMA (SIDEBAR + CONTENT) ==================== */
    .main-wrapper {
      display: flex;
      flex: 1;
      height: calc(100vh - 85px);
      overflow: hidden;
    }

    /* Sidebar Menu Kiri */
    .sidebar {
      width: 260px;
      padding: 0;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background-color: var(--dark-blue);
      height: 100%;
      flex-shrink: 0;
      overflow-y: auto;
      position: relative;
    }

    .sidebar::-webkit-scrollbar {
      width: 5px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    /* Senarai Navigasi */
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 15px;
      position: relative;
      z-index: 2; /* Supaya butang duduk di atas imej latar */
    }

    .menu-btn {
      display: flex;
      align-items: center;
      padding: 13px 20px;
      background-color: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 500;
      gap: 15px;
      border-radius: 0 8px 8px 0;
      margin-right: 10px;
    }

    .menu-btn:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    /* Keadaan Aktif */
    .menu-btn.active {
      background: linear-gradient(90deg, #1d61d1 0%, #3b71ca 100%);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .menu-btn i {
      font-size: 18px;
      width: 22px;
      text-align: center;
      color: #ffffff;
    }

    .menu-text {
      line-height: 1.3;
    }

    /* Latar Bangunan di Bahagian Bawah Sidebar */
    .sidebar-bg-building {
      margin-top: auto; /* Menolak imej ke bawah sekali */
      width: 100%;
      position: relative;
      z-index: 1;
      pointer-events: none;
      opacity: 0.35; /* Kawal ketelusan imej di sini */
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-top: 30px;
    }

    .sidebar-bg-building img {
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: luminosity; /* Menyebatikan grafik dengan warna biru */
    }

    /* Ruang Paparan Kanan */
    .content-area {
      flex: 1;
      height: 100%;
      box-sizing: border-box;
      background-color: #f1f5f9;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- ==================== HEADER UTAMA ==================== -->
  <header class="top-header">
    <div class="header-left">
      <!-- Tukar 'KPM_logo.png' kepada nama/URL fail logo KPM anda -->
      <img class="header-logo" src="KPM_logo.png" alt="Logo KPM">
      
      <div class="header-title-box">
        <h1>KEMENTERIAN PENDIDIKAN</h1>
        <p>Bahagian Profesionalisme Guru</p>
      </div>

      <div class="header-slogan">
        Pendidikan Berkualiti<br>Insan Terdidik Negara Sejahtera
      </div>
    </div>

    <div class="header-right">
      <div class="header-info-group">
        
        <!-- Tarikh Laporan Automatik -->
        <div class="info-item">
          <i class="fa-regular fa-calendar-check"></i>
          <div class="info-text-box">
            <span class="info-label">Tarikh Laporan</span>
            <span class="info-value" id="tarikh-laporan">-</span>
          </div>
        </div>

        <div class="info-divider"></div>

        <!-- Masa Dikemas Kini Automatik -->
        <div class="info-item">
          <i class="fa-solid fa-rotate"></i>
          <div class="info-text-box">
            <span class="info-label">Dikemas Kini</span>
            <span class="info-value" id="masa-kemaskini">-</span>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- ==================== BEKAS UTAMA ==================== -->
  <div class="main-wrapper">
    
    <!-- Sidebar Kiri -->
    <div class="sidebar">
      
      <!-- Senarai Menu -->
      <div class="nav-list">
        <a class="menu-btn active" href="https://datastudio.google.com/embed/reporting/85805ae9-776c-4bb3-b2e2-d73507393f10/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
          <i class="fa-solid fa-house"></i>
          <span class="menu-text">Laman Utama</span>
        </a>

        <a class="menu-btn" href="https://datastudio.google.com/embed/reporting/85805ae9-776c-4bb3-b2e2-d73507393f10/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
          <i class="fa-regular fa-file-lines"></i>
          <span class="menu-text">Standard Verifikasi SPLa</span>
        </a>

        <a class="menu-btn" href="https://lookerstudio.google.com/embed/reporting/81654b52-a3eb-4542-914c-828ea06b8d4b/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
          <i class="fa-solid fa-gear"></i>
          <span class="menu-text">Pelaksanaan SPLa</span>
        </a>

        <a class="menu-btn" href="https://datastudio.google.com/embed/reporting/8c040687-9881-439c-8290-4e2f12b486ca/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
          <i class="fa-solid fa-user"></i>
          <span class="menu-text">Penceramah &amp; Slot</span>
        </a>

        <a class="menu-btn" href="https://datastudio.google.com/embed/reporting/ff08c01e-df02-4565-95d6-f8e8c89d9861/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
          <i class="fa-solid fa-chart-column"></i>
          <span class="menu-text">Keberkesanan Program</span>
        </a>

        <a class="menu-btn" href="https://datastudio.google.com/embed/reporting/8791b019-9a18-4451-910f-8b8afe893301/page/mZD4F" target="iframe_konten" onclick="tukarAktif(this)">
          <i class="fa-regular fa-clipboard"></i>
          <span class="menu-text">Pemantauan &amp;<br>Tindakan Susulan</span>
        </a>
      </div>

      <!-- Imej Bangunan di Bahagian Bawah -->
      <!-- Gantikan 'bangunan.png' dengan fail imej bangunan anda -->
      <div class="sidebar-bg-building">
        <img src="bangunan.png" alt="Latar Bangunan">
      </div>

    </div>

    <!-- Ruang Paparan Iframe -->
    <div class="content-area">
      <iframe id="iframe_konten" name="iframe_konten" src="https://lookerstudio.google.com/embed/reporting/85805ae9-776c-4bb3-b2e2-d73507393f10/page/mZD4F" allowfullscreen></iframe>
    </div>

  </div>

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    // Fungsi Menukar Menu Aktif
    function tukarAktif(element) {
      var buttons = document.querySelectorAll('.menu-btn');
      buttons.forEach(function(btn) {
        btn.classList.remove('active');
      });
      element.classList.add('active');
    }

    // Fungsi Set Tarikh & Masa Automatik Mengikut Sistem
    function setTarikhSemasa() {
      const bulanNames = [
        "Jan", "Feb", "Mac", "Apr", "Mei", "Jun", 
        "Jul", "Ogo", "Sep", "Okt", "Nov", "Dis"
      ];

      const kini = new Date();

      // Dapatkan Tarikh
      const hari = kini.getDate();
      const bulan = bulanNames[kini.getMonth()];
      const tahun = kini.getFullYear();

      // Dapatkan Masa (Format 12-Jam AM/PM)
      let jam = kini.getHours();
      const minit = kini.getMinutes().toString().padStart(2, '0');
      const ampm = jam >= 12 ? 'PM' : 'AM';
      
      jam = jam % 12;
      jam = jam ? jam : 12; // Jam '0' ditukar kepada '12'

      // Format Teks
      const formatTarikh = `${hari} ${bulan} ${tahun}`;
      const formatMasa = `${hari} ${bulan} ${tahun} ${jam}:${minit} ${ampm}`;

      // Masukkan ke dalam HTML
      document.getElementById('tarikh-laporan').innerText = formatTarikh;
      document.getElementById('masa-kemaskini').innerText = formatMasa;
    }

    // Jalankan skrip apabila halaman selesai dimuatkan
    window.onload = function() {
      setTarikhSemasa();
    };
  </script>

</body>
</html>
